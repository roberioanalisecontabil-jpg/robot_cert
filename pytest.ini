[pytest]
# `pytest` sem argumentos deve rodar só a suíte real. Sem isto, a coleta
# varre robot_cert-main/ (backup do zip antigo, gitignored) e quebra com
# ImportPathMismatchError — os arquivos de teste de lá têm o mesmo nome de
# módulo que os de tests/.
testpaths = tests

norecursedirs =
    robot_cert-main
    .venv
    build
    dist
    build_smoke
    dist_smoke
    scratch
    .git
    __pycache__
