<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certificados PFX — Painel</title>
    <link rel="icon" href="/favicon.ico?v=brand-gold-v1" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Peso 800 removido: era baixado e nunca usado (nenhum font-weight:800 no projeto). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/static/style.css?v=instalador-na-matriz-2026-08" />
    <style nonce="{{ request.state.nonce }}">
      /* .barra-selecao migrou para o style.css em 18/08: a aba Seleção do
         Acompanhamento passou a usá-la, e regra compartilhada dentro do
         <style> de uma tela é como esc() acabou duplicada em seis. */
      #tbody .chk-cert:disabled { cursor: not-allowed; opacity: 0.45; }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Pular para o conteúdo principal</a>
    {% include "_sidebar.html" %}

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <header class="page-header">
        <h1>Painel de Certificados</h1>
        <p>Visão geral dos certificados digitais mapeados pelo agente.</p>
      </header>

      <!-- Resumo em cards do Início -->
      <div class="cards-grid">
        <div class="dashboard-card card-total">
          <div class="card-info">
            <span class="card-title">Total</span>
            <span class="card-number" id="n-tot">0</span>
          </div>
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" />
            </svg>
          </div>
        </div>

        <div class="dashboard-card card-validos">
          <div class="card-info">
            <span class="card-title">Ativo</span>
            <span class="card-number" id="n-ok">0</span>
          </div>
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
            </svg>
          </div>
        </div>

        <div class="dashboard-card card-expirando">
          <div class="card-info">
            <span class="card-title">Expirando</span>
            <span class="card-number" id="n-exp-soon">0</span>
            <span class="card-subtitle">Próximos 30 dias</span>
          </div>
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>

        <div class="dashboard-card card-erros">
          <div class="card-info">
            <span class="card-title">Erro</span>
            <span class="card-number" id="n-erros">0</span>
          </div>
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
          </div>
        </div>

        <div class="dashboard-card card-sem-padrao">
          <div class="card-info">
            <span class="card-title">Falha (sem padrão)</span>
            <span class="card-number" id="n-sem-padrao">0</span>
          </div>
          <div class="card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Tabela -->
      <div class="table-container" id="table-container-dash">
        <div class="toolbar">
          <div class="toolbar__status" aria-live="polite">
            <p id="status-msg" class="status-line"></p>
            <p class="hint" id="data-hint"></p>
            <p id="panel-hint" class="hint" style="display: none; color: var(--warning-text);"></p>
          </div>
          <div class="toolbar__actions">
            <label for="filtro-status" class="cg-sr-only">Filtrar por status do certificado</label>
            <select id="filtro-status" title="Filtrar por status" style="padding: 0.55rem; border: 1px solid var(--border); border-radius: 8px;">
              <option value="todos">Todos</option>
              <option value="validos">Ativo</option>
              <option value="prestes_vencer">Expirando</option>
              <option value="erros">Erro</option>
              <option value="sem_padrao">Falha (sem padrão)</option>
            </select>
            <label for="busca-cert" class="cg-sr-only">Buscar certificado por nome, CNPJ ou CPF</label>
            <input
              type="search"
              id="busca-cert"
              placeholder="Buscar por nome, CNPJ ou CPF"
              title="Busca por nome do certificado, CNPJ/CPF com ou sem pontuação"
              style="padding: 0.55rem 0.7rem; min-width: 260px; border: 1px solid var(--border); border-radius: 8px;"
            />
            <button type="button" id="btn-refresh" class="primary">Atualizar tabela</button>
            <button type="button" id="btn-export-pdf">Exportar PDF</button>
            <button type="button" id="btn-export-excel">Exportar Excel</button>
          </div>
        </div>

        <div class="table-scroll-anchor">
          <div class="table-scroll" tabindex="0" role="region" aria-label="Tabela de certificados">
            <table role="table">
              <thead role="rowgroup">
                <tr role="row">
                  <th role="columnheader" style="width: 40px; text-align: center;">
                    <input type="checkbox" id="chkSelTodos" title="Selecionar os instaláveis desta página"
                           aria-label="Selecionar os instaláveis desta página" />
                  </th>
                  <th role="columnheader">Status</th>
                  <th role="columnheader">Nome (titular)</th>
                  <th role="columnheader">Emissão</th>
                  <th role="columnheader">Vencimento</th>
                  <th role="columnheader">CNPJ / CPF</th>
                </tr>
              </thead>
              <tbody role="rowgroup" id="tbody"></tbody>
            </table>
          </div>
        </div>
        <nav id="paginacao-toolbar" class="cg-page-nav" aria-label="Navegação por páginas">
          <div id="pag-info-dash" class="cg-page-nav__meta"></div>
          <div class="cg-page-nav__row">
            <ul id="pag-ul-dash" class="cg-page-nav__ul" role="list">
              <li>
                <button
                  type="button"
                  id="btn-pag-prev"
                  class="cg-page-link cg-page-link--rounded-s"
                  title="Página anterior"
                >
                  Anterior
                </button>
              </li>
              <li id="pag-li-next-dash">
                <button
                  type="button"
                  id="btn-pag-next"
                  class="cg-page-link cg-page-link--rounded-e"
                  title="Próxima página"
                >
                  Seguinte
                </button>
              </li>
            </ul>
            <div>
              <label for="pag-perpage-dash" class="cg-sr-only">Registros por página</label>
              <select id="pag-perpage-dash" class="cg-page-perpage-select" title="Itens por página">
                <option value="10">10 por página</option>
                <option value="25">25 por página</option>
                <option value="50">50 por página</option>
                <option value="100">100 por página</option>
              </select>
            </div>
          </div>
        </nav>
      </div>

      <!-- A barra fica no fluxo do <main> e não em position:fixed sobre a
           janela: fixa, ela taparia a paginação no celular, que é justamente o
           controle que o usuário precisa para continuar escolhendo. Só aparece
           quando há seleção. -->
      <div id="barraSelecao" class="barra-selecao" role="region"
           aria-label="Certificados selecionados" hidden>
        <div class="barra-selecao__texto">
          <strong id="selContagem"></strong>
          <span id="selAviso" class="barra-selecao__aviso"></span>
        </div>
        <div class="barra-selecao__acoes">
          <button id="btnLimparSel" class="btn btn-secondary" type="button">Limpar</button>
          <button id="btnBaixarSel" class="btn btn-primary" type="button">Baixar instalador</button>
        </div>
      </div>

    </main>

    <script nonce="{{ request.state.nonce }}" src="/static/ui-common.js?v=icones-topbar-2026-08"></script>
    <script nonce="{{ request.state.nonce }}">
      const fonte = () => getDataFonte();
      const LS_PER_PAGE_DASH = "cg_per_page_dashboard";
      const ALLOWED_PER_PAGE_DASH = [10, 25, 50, 100];

      function porPaginaDashboard() {
        const sel = document.getElementById("pag-perpage-dash");
        const n = sel ? parseInt(sel.value, 10) : 10;
        return ALLOWED_PER_PAGE_DASH.includes(n) ? n : 10;
      }

      function initPerPageDashboard() {
        const sel = document.getElementById("pag-perpage-dash");
        if (!sel) return;
        let stored = parseInt(localStorage.getItem(LS_PER_PAGE_DASH) || "10", 10);
        if (!ALLOWED_PER_PAGE_DASH.includes(stored)) stored = 10;
        sel.value = String(stored);
        localStorage.setItem(LS_PER_PAGE_DASH, String(stored));
        sel.addEventListener("change", () => {
          localStorage.setItem(LS_PER_PAGE_DASH, sel.value);
          paginaAtual = 1;
          carregarTabela();
        });
      }

      let paginaAtual = 1;
      let timerDebounceBusca = null;
      let itensOriginais = [];
      let itensVisiveis = [];

      const fmt = (iso) => {
        if (!iso) return "—";
        const d = new Date(iso);
        return d.toLocaleString("pt-BR", { timeZone: "UTC" });
      };

      /** Vencido por `not_after` mesmo que o snapshot ainda diga `ok` (agente sem reenviar). */
      const aplicarFlagsDatasCert = (it, now, thirtyDaysFromNow) => {
        let isExpiringSoon = false;
        let expiredByDate = false;
        if (it.not_after) {
          const expiry = new Date(it.not_after);
          if (!Number.isNaN(expiry.getTime())) {
            if (expiry < now) expiredByDate = true;
            else if (expiry <= thirtyDaysFromNow && expiry >= now) isExpiringSoon = true;
          }
        }
        it._isExpiringSoon = isExpiringSoon;
        it._isExpiredByDate = expiredByDate;
      };

      // A aparência do badge vem de `badgeStatus` (ui-common.js); aqui fica só
      // a RESOLUÇÃO do estado, que é específica desta tela — `_isExpiredByDate`
      // e `_isExpiringSoon` são calculados no cliente e não existem lá.
      //
      // Antes, o mapeamento estado→aparência estava escrito aqui e de novo em
      // `colaborador_certificados.html`. Duas cópias da mesma regra divergem.
      const badge = (it) => {
        const s = it.status;
        if (s === "expirado" || it._isExpiredByDate) return badgeStatus("vencido");
        if (s === "ok") {
          return badgeStatus(it._isExpiringSoon ? "expirando" : "ativo");
        }
        return badgeStatus(s);
      };

      function toggleLoading(show, text) {
        if (typeof setTableLoading === "function") {
          setTableLoading("table-container-dash", show, text);
        }
      }

      // `esc` vem de ui-common.js desde 16/08 — era duplicada em seis telas.

      function apenasDigitos(v) {
        return String(v || "").replace(/\D+/g, "");
      }

      function normalizarTexto(v) {
        return String(v || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      }

      function atualizarCards(items) {
        let total = items.length;
        let okCount = 0;
        let expirandoCount = 0;
        let vencidosCount = 0;
        let erroCount = 0;
        let semPadraoCount = 0;
        items.forEach((it) => {
          if (it.status === "expirado" || it._isExpiredByDate) {
            vencidosCount++;
          } else if (it.status === "erro") {
            erroCount++;
          } else if (it.status === "fora_do_padrao") {
            semPadraoCount++;
          } else if (it.status === "ok") {
            if (it._isExpiringSoon) expirandoCount++;
            else okCount++;
          }
        });
        document.getElementById("n-tot").textContent = total;
        document.getElementById("n-ok").textContent = okCount;
        document.getElementById("n-exp-soon").textContent = expirandoCount;
        document.getElementById("n-erros").textContent = erroCount;
        document.getElementById("n-sem-padrao").textContent = semPadraoCount;
      }

      function atualizarCardsResumo(r) {
        if (!r) return;
        document.getElementById("n-tot").textContent = r.total ?? 0;
        document.getElementById("n-ok").textContent = r.validos ?? 0;
        document.getElementById("n-exp-soon").textContent = r.expirando ?? 0;
        document.getElementById("n-erros").textContent = r.erros ?? 0;
        document.getElementById("n-sem-padrao").textContent = r.sem_padrao ?? 0;
      }


      /** Há filtro ativo? Muda o texto do estado vazio: "sem resultado" ≠ "sem dado". */
      function temFiltroAtivo() {
        const st = document.getElementById("filtro-status")?.value || "todos";
        const bu = (document.getElementById("busca-cert")?.value || "").trim();
        return st !== "todos" || bu !== "";
      }

      function renderEstadoVazio() {
        if (temFiltroAtivo()) {
          renderEmptyRow("tbody", 6, {
            icon: "🔍",
            title: "Nenhum certificado corresponde ao filtro",
            description:
              "Ajuste a busca ou o status selecionado para ver outros certificados.",
            actionText: "Limpar filtros",
            onAction: () => {
              const sel = document.getElementById("filtro-status");
              const bu = document.getElementById("busca-cert");
              if (sel) sel.value = "todos";
              if (bu) bu.value = "";
              paginaAtual = 1;
              carregarTabela();
            },
          });
        } else {
          renderEmptyRow("tbody", 6, {
            icon: "📭",
            title: "Nenhum certificado mapeado ainda",
            description:
              "O agente ainda não enviou dados. Verifique se ele está em execução no servidor e se a pasta de origem está configurada.",
            actionText: "Atualizar tabela",
            onAction: () => {
              paginaAtual = 1;
              carregarTabela();
            },
          });
        }
      }

      // ─── Seleção e instalação ────────────────────────────────────────────
      //
      // A tabela pagina no servidor, então `renderTabela` reconstrói o tbody a
      // cada página. A seleção não pode viver nos checkboxes: marcar três na
      // página 1 e ir para a 2 apagaria tudo, sem aviso. Ela vive aqui, por
      // fingerprint, e os checkboxes são só a projeção dela na página visível.
      // Vem do servidor (`MAX_CERTIFICADOS_POR_TOKEN`): repetir o número aqui
      // criaria duas verdades, e a divergência apareceria como a tela deixando
      // marcar mais do que a rota aceita — erro só no download.
      const MAX_CERTIFICADOS = {{ max_certificados }};

      const _selecao = new Map();      // fingerprint -> { id, nome }
      let _instalabilidade = {};       // fingerprint -> { id, estado }
      let _instalMachineId = null;
      let _instalIndisponivel = false;

      // O motivo é a parte que evita a armadilha: um checkbox desabilitado sem
      // explicação parece defeito da tela. Com o motivo, o usuário sabe se
      // espera (o agente ainda não enviou) ou se pede acesso (fora da carteira).
      const MOTIVO = {
        vencido: "Certificado vencido",
        ilegivel: "O robô não conseguiu ler este arquivo",
        bloqueado: "Custódia desativada pelo administrador",
        fora_da_carteira: "Fora da sua carteira — peça ao gestor",
        nao_enviado: "Aguardando o envio pelo agente",
      };

      function estadoDe(it) {
        const fp = it.fingerprint_sha256;
        if (!fp) return { estado: "ilegivel", id: null };
        return _instalabilidade[fp] || { estado: "nao_enviado", id: null };
      }

      function celulaSelecao(it) {
        const fp = it.fingerprint_sha256 || "";
        const e = estadoDe(it);
        const ok = e.estado === "ok" && !!e.id && !_instalIndisponivel;
        const motivo = _instalIndisponivel
          ? "Não foi possível verificar a disponibilidade"
          : (MOTIVO[e.estado] || "");
        return (
          "<td role='cell' data-label='Selecionar' style='text-align:center'>" +
          "<input type='checkbox' class='chk-cert'" +
          " data-fp='" + esc(fp) + "'" +
          " data-id='" + esc(e.id || "") + "'" +
          " data-nome='" + esc(it.nome || it.display_name || "") + "'" +
          (ok ? "" : " disabled") +
          (ok && _selecao.has(fp) ? " checked" : "") +
          (ok ? "" : " title='" + esc(motivo) + "'") +
          " aria-label='" + esc(ok ? "Selecionar certificado" : motivo) + "' />" +
          (ok ? "" : "<span class='cg-sr-only'>" + esc(motivo) + "</span>") +
          "</td>"
        );
      }

      function atualizarBarraSelecao() {
        const barra = document.getElementById("barraSelecao");
        const n = _selecao.size;
        barra.hidden = n === 0;
        if (n === 0) return;
        document.getElementById("selContagem").textContent =
          n === 1 ? "1 certificado selecionado" : `${n} certificados selecionados`;
        const excedeu = n > MAX_CERTIFICADOS;
        document.getElementById("selAviso").textContent = excedeu
          ? `Máximo de ${MAX_CERTIFICADOS} por instalador — desmarque ${n - MAX_CERTIFICADOS}.`
          : "";
        document.getElementById("btnBaixarSel").disabled = excedeu;
      }

      function sincronizarCheckboxesDaPagina() {
        document.querySelectorAll("#tbody .chk-cert").forEach((c) => {
          if (!c.disabled) c.checked = _selecao.has(c.dataset.fp);
        });
        const habilitados = Array.from(
          document.querySelectorAll("#tbody .chk-cert:not([disabled])")
        );
        const todos = document.getElementById("chkSelTodos");
        todos.disabled = habilitados.length === 0;
        todos.checked = habilitados.length > 0 && habilitados.every((c) => c.checked);
      }

      async function carregarInstalabilidade(machineId) {
        if (!machineId || machineId === _instalMachineId) return;
        _instalMachineId = machineId;
        try {
          const r = await fetch(
            `/api/cert-installer/instalabilidade?machine_id=${encodeURIComponent(machineId)}`,
            { headers: getHeaders() }
          );
          if (!r.ok) throw new Error(await mensagemCorpoErro(r));
          const d = await r.json();
          _instalabilidade = d.itens || {};
          _instalIndisponivel = false;
        } catch (e) {
          // Na dúvida, nada fica selecionável. Uma tela que marca tudo como
          // instalável quando não conseguiu verificar convida ao erro que o
          // servidor vai recusar depois — e o usuário só descobre no download.
          _instalabilidade = {};
          _instalIndisponivel = true;
          showToast("Não foi possível verificar quais certificados estão disponíveis.", "error");
        }
      }

      async function baixarSelecionados() {
        const btn = document.getElementById("btnBaixarSel");
        const escolhidos = Array.from(_selecao.entries());
        if (!escolhidos.length) return;

        btn.disabled = true;
        const rotulo = btn.textContent;
        btn.textContent = "Gerando...";
        try {
          const r = await fetch("/api/cert-installer/preparar-download", {
            method: "POST",
            headers: getHeaders(true),
            body: JSON.stringify({
              certificate_ids: escolhidos.map(([, v]) => v.id),
              nome:
                escolhidos.length === 1
                  ? escolhidos[0][1].nome || "Certificado"
                  : `${escolhidos.length} certificados`,
            }),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || "Falha ao gerar o instalador");
          window.location.href = d.download_url;
          showToast("Instalador gerado. O download vai começar.", "success");
        } catch (e) {
          showToast("Não foi possível gerar o instalador: " + e.message, "error");
        } finally {
          btn.textContent = rotulo;
          atualizarBarraSelecao();
        }
      }

      function renderTabela(items) {
        const colTipo = (it) => {
          const lbl = it.documento_tipo_label || (it.documento_tipo ? String(it.documento_tipo).toUpperCase() : "");
          if (lbl) {
            const f = it.documento_formatado || it.documento_numero || "";
            return (
              "<span class='doc-type-label'>" +
              esc(lbl) +
              "</span>" +
              (f ? "<span class='doc-type-num'>" + esc(f) + "</span>" : "")
            );
          }
          if (it.error_message) {
            let msg = it.error_message;
            if (msg && msg.toLowerCase().includes("invalid password")) msg = "Senha incorreta";
            return "<span class='error-cell'>" + esc(msg) + "</span>";
          }
          return "—";
        };

        const tb = document.getElementById("tbody");
        limparSkeleton(tb);

        if (!items.length) {
          renderEstadoVazio();
          return;
        }

        // role="row"/"cell" e data-label sustentam o layout de cards < 768px
        // (ver .table-scroll no media query de style.css).
        tb.innerHTML = items
          .map(
            (it) =>
              "<tr role='row'>" +
              celulaSelecao(it) +
              "<td role='cell' data-label='Status'>" +
              badge(it) +
              "</td><td role='cell' data-label='Nome'>" +
              esc(it.nome != null && it.nome !== "" ? it.nome : it.display_name) +
              "</td><td role='cell' data-label='Emissão'>" +
              fmt(it.not_before) +
              "</td><td role='cell' data-label='Vencimento'>" +
              fmt(it.not_after) +
              "</td><td role='cell' data-label='CNPJ / CPF' class='td-doc'>" +
              colTipo(it) +
              "</td></tr>"
          )
          .join("");

        sincronizarCheckboxesDaPagina();
      }

      function atualizarPaginacaoUI(pg) {
        cgPageNavRefresh({
          bar: "paginacao-toolbar",
          meta: "pag-info-dash",
          ul: "pag-ul-dash",
          liNext: "pag-li-next-dash",
          prev: "btn-pag-prev",
          next: "btn-pag-next",
          pg: pg,
          metaFormatter: (p) =>
            "Página " + p.pagina + " de " + p.total_paginas + " · " + p.total_itens + " linhas",
          hideWhenSingle: true,
          goToPage: (pn) => {
            paginaAtual = pn;
            carregarTabela();
          },
          maxButtons: 5,
        });
      }

      function statusTexto(it) {
        if (it.status === "expirado" || it._isExpiredByDate) return "Vencido";
        if (it.status === "ok" && it._isExpiringSoon) return "Expirando";
        if (it.status === "ok") return "Ativo";
        if (it.status === "fora_do_padrao") return "Falha (sem padrão)";
        if (it.status === "erro") return "Erro";
        return String(it.status || "");
      }

      async function carregarTodosFiltradosParaExportacao() {
        toggleLoading(true, "Preparando exportação...");
        try {
          const params = new URLSearchParams({
            fonte: fonte(),
            filtro_status: document.getElementById("filtro-status")?.value || "todos",
            busca: document.getElementById("busca-cert")?.value || "",
            todas_filtradas: "true",
          });
          const r = await fetch("/api/certificados?" + params.toString(), { headers: getHeaders() });
          if (r.status === 401) {
            logout();
            return null;
          }
          if (!r.ok) {
            showToast("Não foi possível exportar (erro " + r.status + "): " + (await mensagemCorpoErro(r)), "error");
            return null;
          }
          return await r.json();
        } finally {
          toggleLoading(false);
        }
      }

      async function exportarExcelVisivel() {
        const d = await carregarTodosFiltradosParaExportacao();
        if (!d || !d.itens) return;
        if (d.lista_truncada) {
          showToast(
            "O arquivo contém apenas os primeiros " +
              d.itens.length.toLocaleString("pt-BR") +
              " registros — o filtro atual excede o limite de exportação.",
            "warning"
          );
        }
        const headers = ["Status", "Nome", "Emissão", "Vencimento", "Documento"];
        const rows = d.itens.map((it) => [
          statusTexto(it),
          (it.nome != null && it.nome !== "" ? it.nome : it.display_name) || "",
          fmt(it.not_before),
          fmt(it.not_after),
          it.documento_formatado || it.documento_numero || "",
        ]);
        const all = [headers, ...rows];
        const csv = all
          .map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";"))
          .join("\n");
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "certificados_filtrados.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function exportarPdfVisivel() {
        const d = await carregarTodosFiltradosParaExportacao();
        if (!d || !d.itens) return;
        if (d.lista_truncada) {
          showToast(
            "O PDF contém apenas os primeiros " +
              d.itens.length.toLocaleString("pt-BR") +
              " registros — o filtro atual excede o limite de exportação.",
            "warning"
          );
        }
        const linhas = d.itens
          .map((it) => `
            <tr>
              <td>${esc(statusTexto(it))}</td>
              <td>${esc((it.nome != null && it.nome !== "" ? it.nome : it.display_name) || "")}</td>
              <td>${esc(fmt(it.not_before))}</td>
              <td>${esc(fmt(it.not_after))}</td>
              <td>${esc(it.documento_formatado || it.documento_numero || "")}</td>
            </tr>
          `)
          .join("");
        const w = window.open("", "_blank");
        if (!w) return;
        w.document.write(`
          <html>
            <head>
              <meta charset="utf-8" />
              <title>Certificados filtrados</title>
              <style>
                body { font-family: Segoe UI, Arial, sans-serif; padding: 20px; }
                h1 { margin: 0 0 8px; font-size: 20px; }
                p { margin: 0 0 14px; color: #555; }
                table { width: 100%; border-collapse: collapse; font-size: 12px; }
                th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
                th { background: #f3f4f6; }
              </style>
            </head>
            <body>
              <h1>Certificados filtrados</h1>
              <p>Gerado em ${new Date().toLocaleString("pt-BR")} | Total exportado: ${d.itens.length}</p>
              <table>
                <thead>
                  <tr>
                    <th>Status</th><th>Nome</th><th>Emissão</th><th>Vencimento</th><th>Documento</th>
                  </tr>
                </thead>
                <tbody>${linhas}</tbody>
              </table>
            </body>
          </html>
        `);
        w.document.close();
        w.focus();
        w.print();
      }

      let primeiroCarregamento = true;

      async function carregarTabela() {
        const st = document.getElementById("status-msg");
        const ph = document.getElementById("panel-hint");
        ph.style.display = "none";
        st.textContent = "Carregando…";

        // Primeiro carregamento: skeleton (não há dado antigo para preservar).
        // Recargas: overlay, que mantém a tabela anterior visível e evita o
        // "pisca" de a tela inteira virar blocos cinzentos a cada filtro.
        if (primeiroCarregamento) {
          renderSkeletonRows("tbody", porPaginaDashboard() > 10 ? 10 : porPaginaDashboard(), 6);
        } else {
          toggleLoading(true, "Carregando certificados...");
        }

        try {
          const f = fonte();
          const params = new URLSearchParams({
            fonte: f,
            pagina: String(paginaAtual),
            por_pagina: String(porPaginaDashboard()),
            filtro_status: document.getElementById("filtro-status")?.value || "todos",
            busca: document.getElementById("busca-cert")?.value || "",
          });
          const r = await fetch("/api/certificados?" + params.toString(), { headers: getHeaders() });
          if (r.status === 401) {
            logout(); // Se falhar por 401, token expirou ou é inválido
            return;
          }
          if (r.status === 404) {
            st.textContent = "Fonte “remoto”: ainda sem dados.";
            atualizarPaginacaoUI(null);
            renderEmptyRow("tbody", 6, {
              icon: "🛰️",
              title: "A fonte remota ainda não tem dados",
              description:
                "Selecione a fonte “local” ou “auto” em Configuração, ou inicie o agente no servidor Windows.",
              actionText: "Abrir Configuração",
              onAction: () => (window.location.href = "/configuracao"),
            });
            return;
          }
          if (!r.ok) {
            const detalhe = await mensagemCorpoErro(r);
            st.textContent = "Erro " + r.status;
            showToast("Não foi possível carregar os certificados: " + detalhe, "error");
            renderEmptyRow("tbody", 6, {
              icon: "⚠️",
              title: "Erro ao carregar os certificados",
              description: detalhe || "O servidor respondeu com erro " + r.status + ".",
              actionText: "Tentar novamente",
              onAction: () => carregarTabela(),
            });
            return;
          }
          let d;
          try {
            d = await r.json();
          } catch (jsonErr) {
            st.textContent = "Resposta inválida do servidor.";
            showToast("Resposta inválida do servidor. Confirme o endereço da API.", "error");
            renderEmptyRow("tbody", 6, {
              icon: "⚠️",
              title: "Resposta inválida do servidor",
              description: "Confirme o endereço da API em Configuração.",
              actionText: "Tentar novamente",
              onAction: () => carregarTabela(),
            });
            return;
          }
          st.textContent = "Atualizado em: " + new Date(d.atualizado_em).toLocaleString("pt-BR");
          const items = d.itens || [];
          if (d.paginacao) {
            paginaAtual = d.paginacao.pagina;
            atualizarPaginacaoUI(d.paginacao);
            atualizarCardsResumo(d.resumo);
          } else {
            atualizarPaginacaoUI(null);
            const now = new Date();
            const thirtyDaysFromNow = new Date();
            thirtyDaysFromNow.setDate(now.getDate() + 30);
            items.forEach((it) => aplicarFlagsDatasCert(it, now, thirtyDaysFromNow));
            atualizarCards(items);
          }
          // Aviso ANTES de exportar, não depois que o arquivo já saiu incompleto.
          setBannerAviso("table-container-dash", mensagemLimiteExportacao(d.paginacao));
          itensOriginais = items;
          itensVisiveis = items;

          // Antes de desenhar: sem a instalabilidade, todas as linhas sairiam
          // desabilitadas por um instante e o usuário veria a tela "travada".
          // O machine_id vem na RAIZ do payload, não em cada item — mesma
          // pegadinha que causou o bug do opt-in em 08/08.
          await carregarInstalabilidade(d.machine_id);

          renderTabela(items);
          atualizarBarraSelecao();
        } catch (e) {
          st.textContent = "Falha de conexão.";
          showToast("Falha de conexão com o servidor: " + e, "error");
          renderEmptyRow("tbody", 6, {
            icon: "🔌",
            title: "Sem conexão com o servidor",
            description: "Verifique se o portal está em execução e tente novamente.",
            actionText: "Tentar novamente",
            onAction: () => carregarTabela(),
          });
        } finally {
          toggleLoading(false);
          limparSkeleton("tbody");
          primeiroCarregamento = false;
        }
      }

      document.getElementById("btn-refresh").addEventListener("click", () => {
        paginaAtual = 1;
        carregarTabela();
      });
      document.getElementById("btn-export-excel").addEventListener("click", () => void exportarExcelVisivel());
      document.getElementById("btn-export-pdf").addEventListener("click", () => void exportarPdfVisivel());
      document.getElementById("filtro-status").addEventListener("change", () => {
        paginaAtual = 1;
        carregarTabela();
      });
      document.getElementById("busca-cert").addEventListener("input", () => {
        paginaAtual = 1;
        clearTimeout(timerDebounceBusca);
        timerDebounceBusca = setTimeout(() => carregarTabela(), 350);
      });
      document.getElementById("btn-pag-prev").addEventListener("click", () => {
        if (paginaAtual > 1) {
          paginaAtual--;
          carregarTabela();
        }
      });
      document.getElementById("btn-pag-next").addEventListener("click", () => {
        paginaAtual++;
        carregarTabela();
      });
      window.addEventListener("storage", (ev) => {
        if (ev.key === "cert_robot_data_fonte" || ev.key === KEY_STORAGE) {
          const ph = document.getElementById("panel-hint");
          if (ev.key === "cert_robot_data_fonte") {
            ph.textContent = "A fonte dos dados foi alterada noutro separador. Clique em “Atualizar tabela” para refletir.";
            ph.style.display = "block";
          }
        }
      });

      (async function init() {
        // Sidebar por papel: ui-common.js (initSidebarPorPapel) — era copiada
        // por tela e as cópias divergiram: o admin no Início não via
        // Dashboard nem Carteiras.

        // Delegação no tbody: a tabela é reconstruída a cada página, e ouvintes
        // por checkbox teriam de ser religados a cada render.
        document.getElementById("tbody").addEventListener("change", (ev) => {
          const c = ev.target.closest(".chk-cert");
          if (!c || c.disabled) return;
          if (c.checked) {
            _selecao.set(c.dataset.fp, { id: c.dataset.id, nome: c.dataset.nome });
          } else {
            _selecao.delete(c.dataset.fp);
          }
          sincronizarCheckboxesDaPagina();
          atualizarBarraSelecao();
        });

        document.getElementById("chkSelTodos").addEventListener("change", (ev) => {
          // Alcança só os instaláveis DESTA página — marcar 489 de uma vez com
          // teto de 50 seria uma armadilha, não um atalho.
          document.querySelectorAll("#tbody .chk-cert:not([disabled])").forEach((c) => {
            if (ev.target.checked) {
              _selecao.set(c.dataset.fp, { id: c.dataset.id, nome: c.dataset.nome });
            } else {
              _selecao.delete(c.dataset.fp);
            }
          });
          sincronizarCheckboxesDaPagina();
          atualizarBarraSelecao();
        });

        document.getElementById("btnLimparSel").addEventListener("click", () => {
          _selecao.clear();
          sincronizarCheckboxesDaPagina();
          atualizarBarraSelecao();
        });

        document.getElementById("btnBaixarSel").addEventListener("click", baixarSelecionados);

        initPerPageDashboard();
        await carregarTabela();
      })();
    </script>
  </body>
</html>
