<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acompanhamento — Certificados</title>
  <link rel="icon" href="/favicon.ico?v=brand-gold-v1" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Peso 800 removido: era baixado e nunca usado (nenhum font-weight:800 no projeto). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=instalador-na-matriz-2026-08" />
  <style>
    .tab-container-navigation {
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 0.75rem 0.25rem !important;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      box-shadow: none !important;
    }
    .tab-btn:hover {
      color: var(--text);
    }
    .tab-btn.active {
      color: var(--accent-text);
      font-weight: 600;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--accent);
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-to-content">Pular para o conteúdo principal</a>
  {% include "_sidebar.html" %}

  <main class="main-content" id="main-content">
    <header class="page-header">
      <h1>Acompanhamento de Certificados</h1>
      <p>Escolha os certificados a acompanhar e veja o painel com vencimentos.</p>
    </header>

    <div class="table-container" id="table-container-colab">
      <div class="tab-container-navigation">
        <button type="button" id="tab-painel" class="tab-btn active">Painel</button>
        <button type="button" id="tab-selecao" class="tab-btn">Seleção de Certificados</button>
      </div>

      <section id="sec-painel">
        <div class="toolbar">
          <div class="toolbar__actions">
            <label for="busca-painel" class="cg-sr-only">Buscar no painel por nome ou documento</label>
            <input type="search" id="busca-painel" placeholder="Buscar por nome ou documento" style="padding: 0.55rem 0.7rem; min-width: 280px; border: 1px solid var(--border); border-radius: 8px;" />
          </div>
        </div>
        <p class="hint" id="painel-hint"></p>
        <div class="table-scroll-anchor">
          <div class="table-scroll" tabindex="0" role="region" aria-label="Certificados do colaborador">
            <table role="table">
              <thead role="rowgroup">
                <tr role="row"><th role="columnheader">Nome</th><th role="columnheader">CNPJ/CPF</th><th role="columnheader">Vencimento</th><th role="columnheader">Dias restantes</th><th role="columnheader">Status</th></tr>
              </thead>
              <tbody role="rowgroup" id="tbody-painel"></tbody>
            </table>
          </div>
        </div>
        <nav id="paginacao-toolbar-colab-painel" class="cg-page-nav" aria-label="Paginação do painel">
          <div id="pag-meta-colab-painel" class="cg-page-nav__meta"></div>
          <div class="cg-page-nav__row">
            <ul id="pag-ul-colab-painel" class="cg-page-nav__ul" role="list">
              <li>
                <button type="button" id="btn-colab-painel-prev" class="cg-page-link cg-page-link--rounded-s" title="Página anterior">Anterior</button>
              </li>
              <li id="pag-li-next-colab-painel">
                <button type="button" id="btn-colab-painel-next" class="cg-page-link cg-page-link--rounded-e" title="Próxima página">Seguinte</button>
              </li>
            </ul>
            <div>
              <label for="pag-perpage-colab-painel" class="cg-sr-only">Registros por página</label>
              <select id="pag-perpage-colab-painel" class="cg-page-perpage-select" title="Itens por página">
                <option value="10">10 por página</option>
                <option value="25">25 por página</option>
                <option value="50">50 por página</option>
                <option value="100">100 por página</option>
              </select>
            </div>
          </div>
        </nav>
      </section>

      <section id="sec-selecao" style="display:none;">
        <div class="toolbar">
          <div class="toolbar__actions">
            <label for="busca-selecao" class="cg-sr-only">Buscar certificados para selecionar</label>
            <input type="search" id="busca-selecao" placeholder="Buscar por nome ou documento" style="padding: 0.55rem 0.7rem; min-width: 280px; border: 1px solid var(--border); border-radius: 8px;" />
            <!-- "Salvar seleção" saiu daqui para a barra sticky no rodapé:
                 quem marca checkboxes descendo pela tabela paginada não
                 deveria voltar ao topo para salvar o que marcou. -->
          </div>
        </div>
        <div class="table-scroll-anchor">
          <div class="table-scroll" tabindex="0" role="region" aria-label="Seleção de certificados">
            <table role="table">
              <thead role="rowgroup"><tr role="row"><th role="columnheader">Selecionar</th><th role="columnheader">Nome</th><th role="columnheader">CNPJ/CPF</th><th role="columnheader">Status atual</th><th role="columnheader">Vencimento</th></tr></thead>
              <tbody role="rowgroup" id="tbody-selecao"></tbody>
            </table>
          </div>
        </div>
        <nav id="paginacao-toolbar-colab-sel" class="cg-page-nav" aria-label="Paginação da seleção">
          <div id="pag-meta-colab-sel" class="cg-page-nav__meta"></div>
          <div class="cg-page-nav__row">
            <ul id="pag-ul-colab-sel" class="cg-page-nav__ul" role="list">
              <li>
                <button type="button" id="btn-colab-sel-prev" class="cg-page-link cg-page-link--rounded-s" title="Página anterior">Anterior</button>
              </li>
              <li id="pag-li-next-colab-sel">
                <button type="button" id="btn-colab-sel-next" class="cg-page-link cg-page-link--rounded-e" title="Próxima página">Seguinte</button>
              </li>
            </ul>
            <div>
              <label for="pag-perpage-colab-sel" class="cg-sr-only">Registros por página</label>
              <select id="pag-perpage-colab-sel" class="cg-page-perpage-select" title="Itens por página">
                <option value="10">10 por página</option>
                <option value="25">25 por página</option>
                <option value="50">50 por página</option>
                <option value="100">100 por página</option>
              </select>
            </div>
          </div>
        </nav>
        <!-- Sempre visível (sem hidden, ao contrário do Início): salvar com
             zero marcados é uma ação válida aqui — limpa o acompanhamento. -->
        <div class="barra-selecao" role="region" aria-label="Seleção para acompanhamento">
          <div class="barra-selecao__texto">
            <strong id="selColabContagem">0 certificados marcados</strong>
          </div>
          <div class="barra-selecao__acoes">
            <button type="button" id="btn-salvar-selecao" class="primary">Salvar seleção</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script nonce="{{ request.state.nonce }}" src="/static/ui-common.js?v=menu-pela-matriz-2026-08"></script>
  <script nonce="{{ request.state.nonce }}">
    function toggleLoading(show, text) { if (typeof setTableLoading === "function") setTableLoading("table-container-colab", show, text); }
    // `esc` vem de ui-common.js desde 16/08 — era duplicada em seis telas.
    function fmtDataUtc(iso) { if (!iso) return "—"; return new Date(iso).toLocaleString("pt-BR", { timeZone: "UTC" }); }
    const LS_PER_PAGE_COLAB_P = "cg_per_page_colab_painel";
    const LS_PER_PAGE_COLAB_S = "cg_per_page_colab_selecao";
    const ALLOW_PER_PAGE_COLAB = [10, 25, 50, 100];

    let opcoes = [];
    let selecionados = new Set();
    let painelItens = [];
    let filteredPainelItens = [];
    let painelPagina = 1;
    let selecaoPagina = 1;

    function porPagColabPainel() {
      const sel = document.getElementById("pag-perpage-colab-painel");
      const n = sel ? parseInt(sel.value, 10) : 10;
      return ALLOW_PER_PAGE_COLAB.includes(n) ? n : 10;
    }

    function porPagColabSelecao() {
      const sel = document.getElementById("pag-perpage-colab-sel");
      const n = sel ? parseInt(sel.value, 10) : 10;
      return ALLOW_PER_PAGE_COLAB.includes(n) ? n : 10;
    }

    function initPerPageColabPainel() {
      const sel = document.getElementById("pag-perpage-colab-painel");
      if (!sel) return;
      let v = parseInt(localStorage.getItem(LS_PER_PAGE_COLAB_P) || "10", 10);
      if (!ALLOW_PER_PAGE_COLAB.includes(v)) v = 10;
      sel.value = String(v);
      localStorage.setItem(LS_PER_PAGE_COLAB_P, String(v));
      sel.addEventListener("change", () => {
        localStorage.setItem(LS_PER_PAGE_COLAB_P, sel.value);
        painelPagina = 1;
        void carregarPainel(false);
      });
    }

    function initPerPageColabSelecao() {
      const sel = document.getElementById("pag-perpage-colab-sel");
      if (!sel) return;
      let v = parseInt(localStorage.getItem(LS_PER_PAGE_COLAB_S) || "10", 10);
      if (!ALLOW_PER_PAGE_COLAB.includes(v)) v = 10;
      sel.value = String(v);
      localStorage.setItem(LS_PER_PAGE_COLAB_S, String(v));
      sel.addEventListener("change", () => {
        localStorage.setItem(LS_PER_PAGE_COLAB_S, sel.value);
        selecaoPagina = 1;
        renderSelecao();
      });
    }

    // Nome DIFERENTE do helper compartilhado, de propósito: chamava-se
    // `badgeStatus` e passou a delegar para o `badgeStatus` de ui-common.js —
    // que é ele mesmo, e a chamada virava recursão infinita. Foi o
    // `test_nenhum_template_redefine_helper_compartilhado` que acusou.
    //
    // A aparência mora no helper compartilhado; o que sobra aqui é a regra
    // desta tela: valor desconhecido vira "Não encontrado", e não o texto cru,
    // porque a lista do colaborador mostra o que ele selecionou — um documento
    // pode simplesmente não estar no inventário.
    function badgeDoColaborador(v) {
      return BADGE_STATUS[v] ? badgeStatus(v) : badgeStatus("nao_encontrado");
    }

    function renderSelecao() {
      const q = (document.getElementById("busca-selecao").value || "").trim().toLowerCase();
      const rows = opcoes.filter((it) => !q || [it.nome || "", it.documento || ""].join(" ").toLowerCase().includes(q));
      const psz = porPagColabSelecao();
      const total = rows.length;
      const totalPag = Math.max(1, Math.ceil(total / psz));
      if (selecaoPagina > totalPag) selecaoPagina = totalPag;
      const start = (selecaoPagina - 1) * psz;
      const pageRows = rows.slice(start, start + psz);

      if (!pageRows.length) {
        renderEmptyRow("tbody-selecao", 5, q ? {
          icon: "🔍",
          title: "Nenhum certificado para “" + q + "”",
          description: "Tente outro nome ou documento.",
          actionText: "Limpar busca",
          onAction: () => {
            document.getElementById("busca-selecao").value = "";
            selecaoPagina = 1;
            renderSelecao();
          },
        } : {
          icon: "📭",
          title: "Nenhum certificado disponível",
          description: "Não há certificados mapeados para selecionar no momento.",
        });
      } else {
      document.getElementById("tbody-selecao").innerHTML = pageRows.map((it) => {
        let styleStr = "";
        if (it.status === "vencido" || it.status === "erro" || it.status === "fora_do_padrao") {
          styleStr = "background:var(--row-tint-danger);";
        } else if (it.status === "expirando") {
          styleStr = "background:var(--row-tint-warning);";
        }
        return `
        <tr role="row" style="${styleStr}">
          <td role="cell" data-label="Selecionar"><input type="checkbox" aria-label="Acompanhar ${esc(it.nome || it.documento || "certificado")}" data-doc="${esc(it.documento_digitos)}" ${selecionados.has(String(it.documento_digitos)) ? "checked" : ""} /></td>
          <td role="cell" data-label="Nome">${esc(it.nome || "—")}</td>
          <td role="cell" data-label="CNPJ/CPF">${esc(it.documento || "—")}</td>
          <td role="cell" data-label="Status">${badgeDoColaborador(it.status)}</td>
          <td role="cell" data-label="Vencimento">${esc(fmtDataUtc(it.vencimento_certificado))}</td>
        </tr>`;
      }).join("");
      }
      cgPageNavRefresh({
        bar: "paginacao-toolbar-colab-sel",
        meta: "pag-meta-colab-sel",
        ul: "pag-ul-colab-sel",
        liNext: "pag-li-next-colab-sel",
        prev: "btn-colab-sel-prev",
        next: "btn-colab-sel-next",
        pg: { pagina: selecaoPagina, total_paginas: totalPag, total_itens: total },
        metaFormatter: (pg) =>
          "Página " +
          pg.pagina +
          " de " +
          pg.total_paginas +
          " · " +
          pg.total_itens +
          " opção(ões)",
        hideWhenSingle: true,
        goToPage: (pn) => {
          selecaoPagina = pn;
          renderSelecao();
        },
        maxButtons: 5,
      });
    }

    async function carregarPainel(refetch) {
      if (refetch !== false) {
        const r = await fetch("/api/colaborador/certificados/painel", { headers: getHeaders() });
        if (!r.ok) {
          const detalhe = await mensagemCorpoErro(r);
          document.getElementById("painel-hint").textContent = "";
          showToast("Não foi possível carregar o painel: " + detalhe, "error");
          renderEmptyRow("tbody-painel", 5, {
            icon: "⚠️",
            title: "Erro ao carregar o painel",
            description: detalhe || "O servidor respondeu com erro " + r.status + ".",
            actionText: "Tentar novamente",
            onAction: () => void carregarPainel(true),
          });
          cgPageNavHide("paginacao-toolbar-colab-painel", "pag-ul-colab-painel", "pag-meta-colab-painel");
          return;
        }
        const j = await r.json();
        painelItens = j.itens || [];
      }
      const q = (document.getElementById("busca-painel")?.value || "").trim().toLowerCase();
      filteredPainelItens = painelItens.filter((it) => !q || [it.nome || "", it.documento || ""].join(" ").toLowerCase().includes(q));

      const psz = porPagColabPainel();
      const total = filteredPainelItens.length;
      const totalPag = Math.max(1, Math.ceil(total / psz));
      if (painelPagina > totalPag) painelPagina = totalPag;
      const start = (painelPagina - 1) * psz;
      const pageRows = filteredPainelItens.slice(start, start + psz);
      document.getElementById("painel-hint").textContent = `${total} certificado(s) acompanhados` + (q ? " (filtrado)" : "");

      if (!pageRows.length) {
        renderEmptyRow("tbody-painel", 5, q ? {
          icon: "🔍",
          title: "Nenhum certificado para “" + q + "”",
          description: "Tente outro nome ou documento.",
          actionText: "Limpar busca",
          onAction: () => {
            document.getElementById("busca-painel").value = "";
            painelPagina = 1;
            void carregarPainel(false);
          },
        } : {
          icon: "⭐",
          title: "Você ainda não acompanha nenhum certificado",
          description: "Use a aba de seleção para escolher quais certificados quer monitorar.",
        });
      } else {
      document.getElementById("tbody-painel").innerHTML = pageRows.map((it) => {
        let styleStr = "";
        if (it.status === "vencido" || it.status === "erro" || it.status === "fora_do_padrao") {
          styleStr = "background:var(--row-tint-danger);";
        } else if (it.status === "expirando") {
          styleStr = "background:var(--row-tint-warning);";
        }
        return `
        <tr role="row" style="${styleStr}">
          <td role="cell" data-label="Nome">${esc(it.nome)}</td>
          <td role="cell" data-label="CNPJ/CPF">${esc(it.documento)}</td>
          <td role="cell" data-label="Vencimento">${esc(fmtDataUtc(it.vencimento_certificado))}</td>
          <td role="cell" data-label="Dias restantes">${it.dias_restantes == null ? "—" : esc(it.dias_restantes)}</td>
          <td role="cell" data-label="Status">${badgeDoColaborador(it.status)}</td>
        </tr>`;
      }).join("");
      }
      cgPageNavRefresh({
        bar: "paginacao-toolbar-colab-painel",
        meta: "pag-meta-colab-painel",
        ul: "pag-ul-colab-painel",
        liNext: "pag-li-next-colab-painel",
        prev: "btn-colab-painel-prev",
        next: "btn-colab-painel-next",
        pg: { pagina: painelPagina, total_paginas: totalPag, total_itens: total },
        metaFormatter: (pg) =>
          "Página " + pg.pagina + " de " + pg.total_paginas + " · " + pg.total_itens + " no painel",
        hideWhenSingle: true,
        goToPage: (pn) => {
          painelPagina = pn;
          void carregarPainel(false);
        },
        maxButtons: 5,
      });
    }

    async function carregarSelecao() {
      const [ro, rs] = await Promise.all([
        fetch("/api/colaborador/certificados/opcoes", { headers: getHeaders() }),
        fetch("/api/colaborador/certificados/selecionados", { headers: getHeaders() }),
      ]);
      if (!ro.ok || !rs.ok) {
        const det = !ro.ok ? await mensagemCorpoErro(ro) : await mensagemCorpoErro(rs);
        document.getElementById("painel-hint").textContent = "Erro ao carregar opções: " + det;
        opcoes = [];
        renderSelecao();
        return;
      }
      const jo = await ro.json();
      const js = await rs.json();
      opcoes = jo.itens || [];
      selecionados = new Set((js.documentos || []).map(String));
      atualizarBarraColab();
      renderSelecao();
    }

    function atualizarBarraColab() {
      const n = selecionados.size;
      document.getElementById("selColabContagem").textContent =
        n === 1 ? "1 certificado marcado" : n + " certificados marcados";
    }

    async function salvarSelecao() {
      // Do Set, não do DOM: a tabela é paginada, e ler só os checkboxes
      // renderizados descartaria em silêncio o que foi marcado nas OUTRAS
      // páginas — quem marcasse na página 1, fosse à 2 e salvasse perderia
      // a página 1 sem aviso nenhum.
      const docs = Array.from(selecionados);
      const r = await fetch("/api/colaborador/certificados/selecionados", {
        method: "PUT",
        headers: getHeaders(true),
        body: JSON.stringify({ documentos: docs }),
      });
      if (!r.ok) {
        showToast("Não foi possível salvar a seleção: " + (await mensagemCorpoErro(r)), "error");
        return;
      }
      selecionados = new Set(docs);
      atualizarBarraColab();
      painelPagina = 1;
      await carregarPainel(true);
      showToast(
        docs.length === 1
          ? "1 certificado selecionado para acompanhamento."
          : docs.length + " certificados selecionados para acompanhamento.",
        "success"
      );
    }

    function showTab(tab) {
      const p = document.getElementById("sec-painel");
      const s = document.getElementById("sec-selecao");
      const btP = document.getElementById("tab-painel");
      const btS = document.getElementById("tab-selecao");
      const painel = tab === "painel";
      p.style.display = painel ? "block" : "none";
      s.style.display = painel ? "none" : "block";
      btP.classList.toggle("active", painel);
      btS.classList.toggle("active", !painel);
    }

    document.getElementById("tab-painel").addEventListener("click", () => showTab("painel"));
    document.getElementById("tab-selecao").addEventListener("click", () => showTab("selecao"));
    document.getElementById("busca-painel").addEventListener("input", () => { painelPagina = 1; void carregarPainel(false); });
    document.getElementById("busca-selecao").addEventListener("input", () => { selecaoPagina = 1; renderSelecao(); });
    document.getElementById("btn-salvar-selecao").addEventListener("click", salvarSelecao);
    document.getElementById("btn-colab-painel-prev").addEventListener("click", () => {
      if (painelPagina > 1) {
        painelPagina--;
        void carregarPainel(false);
      }
    });
    document.getElementById("btn-colab-painel-next").addEventListener("click", () => {
      const psz = porPagColabPainel();
      const totalPag = Math.max(1, Math.ceil(filteredPainelItens.length / psz));
      if (painelPagina < totalPag) {
        painelPagina++;
        void carregarPainel(false);
      }
    });
    document.getElementById("btn-colab-sel-prev").addEventListener("click", () => {
      if (selecaoPagina > 1) {
        selecaoPagina--;
        renderSelecao();
      }
    });
    document.getElementById("btn-colab-sel-next").addEventListener("click", () => {
      const q = (document.getElementById("busca-selecao").value || "").trim().toLowerCase();
      const rows = opcoes.filter((it) => !q || [it.nome || "", it.documento || ""].join(" ").toLowerCase().includes(q));
      const totalPag = Math.max(1, Math.ceil(rows.length / porPagColabSelecao()));
      if (selecaoPagina < totalPag) {
        selecaoPagina++;
        renderSelecao();
      }
    });
    document.getElementById("tbody-selecao").addEventListener("change", (e) => {
      const el = e.target;
      if (!el || !el.matches("input[type='checkbox'][data-doc]")) return;
      const doc = el.getAttribute("data-doc");
      if (!doc) return;
      if (el.checked) selecionados.add(doc); else selecionados.delete(doc);
      atualizarBarraColab();
    });

    (async function init() {
      // Sidebar por papel: ui-common.js (initSidebarPorPapel).
      initPerPageColabPainel();
      initPerPageColabSelecao();
      toggleLoading(true, "Carregando tela de acompanhamento...");
      try {
        await carregarSelecao();
        await carregarPainel(true);
      } finally {
        toggleLoading(false);
      }
      showTab("painel");
    })();
  </script>
</body>
</html>
