<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Analise Certificado</title>
    <link rel="icon" href="/favicon.ico?v=brand-gold-v1" type="image/x-icon" />
    <link rel="stylesheet" href="/static/style.css?v=s2-feedback-2026-08">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg);
            margin: 0;
            padding: var(--sp-4);
        }
        .login-card {
            background: var(--surface);
            padding: var(--sp-8);
            border-radius: var(--radius-lg);
            border: 0.5px solid var(--border);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            transition: transform var(--duration-normal) var(--ease-spring);
        }
        .login-header {
            text-align: center;
            margin-bottom: var(--sp-6);
        }
        .login-logo {
            display: block;
            width: 80px;
            height: 80px;
            margin: 0 auto var(--sp-4);
            object-fit: contain;
        }
        .login-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--sp-2);
            color: var(--text);
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: var(--sp-4);
        }
        .form-group label {
            display: block;
            margin-bottom: var(--sp-2);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            background-color: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
        }
        .form-group input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }
        .login-btn {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }
        .login-btn:hover {
            background-color: var(--accent-hover);
            opacity: 0.95;
        }
        #login-error {
            color: var(--expired);
            background-color: var(--expired-bg);
            padding: var(--sp-3);
            border-radius: var(--radius-md);
            margin-bottom: var(--sp-4);
            font-size: 0.875rem;
            display: none;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <main class="login-container" id="main-content" style="width: 100%; display: flex; justify-content: center; align-items: center;">
    <div class="login-card">
        <div class="login-header">
            <img src="/static/logo.png?v=brand-gold-v1" alt="Analise Certificado" class="login-logo">
            <h1>Analise Certificado</h1>
            <p>Faça login para acessar o monitor</p>
        </div>
        
        <div id="login-error" role="alert" aria-live="assertive">E-mail ou senha incorretos.</div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required autocomplete="username" placeholder="exemplo@email.com">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn" id="btn-entrar">Entrar</button>
        </form>
    </div>
    </main>

    <script nonce="{{ request.state.nonce }}">
        const KEY_STORAGE = "cert_robot_api_key"; // Manter o mesmo nome por enquanto ou mudar para token

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-entrar');
            const errorDiv = document.getElementById('login-error');

            btn.disabled = true;
            btn.textContent = 'Autenticando...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem(KEY_STORAGE, data.access_token);
                    localStorage.setItem('user_role', data.role);
                    localStorage.setItem('user_email', email);
                    window.location.href = '/';
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.detail || 'Falha ao autenticar.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão com o servidor.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
