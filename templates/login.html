<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Analise Certificado</title>
    <link rel="icon" href="/favicon.ico?v=brand-gold-v1" type="image/x-icon" />
    <!-- Fontes servidas pelo portal, como nas outras páginas: a tela de login
         é a única que todo mundo vê sem sessão, e não pode depender de rede
         externa (nem vazar o acesso para um terceiro). -->
    <link rel="stylesheet" href="/static/aguia-fontes.css">
    <link rel="stylesheet" href="/static/style.css?v=menu-rola-2026-10-15">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg);
            margin: 0;
            padding: var(--sp-4);
        }
        .login-card {
            background: var(--surface);
            padding: var(--sp-8);
            border-radius: var(--radius-lg);
            border: 0.5px solid var(--border);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            transition: transform var(--duration-normal) var(--ease-spring);
        }
        .login-header {
            text-align: center;
            margin-bottom: var(--sp-6);
        }
        .login-logo {
            display: block;
            width: 80px;
            height: 80px;
            margin: 0 auto var(--sp-4);
            object-fit: contain;
        }
        .login-header h1 {
            font-size: var(--fs-section);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--sp-2);
            color: var(--text);
        }
        .login-header p {
            color: var(--text-muted);
            font-size: var(--fs-ui);
        }
        .form-group {
            margin-bottom: var(--sp-4);
        }
        .form-group label {
            display: block;
            margin-bottom: var(--sp-2);
            font-weight: 600;
            font-size: var(--fs-ui-sm);
            color: var(--text);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: var(--fs-ui);
            background-color: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
        }
        .form-group input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }
        .login-btn {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-solid);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            font-size: var(--fs-ui);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }
        .login-btn:hover {
            background-color: var(--accent-hover);
            opacity: 0.95;
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #login-error,
        #rec-msg,
        #lc-msg {
            padding: var(--sp-3);
            border-radius: var(--radius-md);
            margin-bottom: var(--sp-4);
            font-size: var(--fs-ui);
            display: none;
            text-align: center;
            font-weight: 500;
        }
        #login-error,
        .msg-erro {
            color: var(--expired-text);
            background-color: var(--expired-bg);
        }
        /* Sucesso e erro precisam diferir por mais do que a cor: quem não
           distingue vermelho de verde leria as duas do mesmo jeito. O texto de
           cada mensagem já diz o que aconteceu, e o ícone reforça. */
        .msg-ok {
            color: var(--ok-text);
            background-color: var(--ok-bg);
        }

        /* `.campo-senha` e `.btn-olho` migraram para o style.css global em
           18/08: a redefinição de senha em /usuarios passou a usá-las, e
           regra de duas telas dentro do <style> de uma delas é a forma como
           `esc()` acabou duplicada em seis arquivos. */

        .link-discreto {
            display: block;
            width: 100%;
            margin-top: var(--sp-4);
            padding: var(--sp-2);
            background: none;
            border: none;
            color: var(--accent-text);
            font-size: var(--fs-ui-sm);
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }
        .link-discreto:hover { text-decoration: underline; }

        #campo-codigo,
        #lc-codigo {
            text-align: center;
            font-size: var(--fs-section);
            letter-spacing: 0.5em;
            font-weight: 600;
            /* O letter-spacing empurra o texto para a direita; o padding
               compensa para o número parecer centrado de verdade. */
            padding-left: 0.5em;
        }
        .passo-dica {
            color: var(--text-muted);
            font-size: var(--fs-ui-sm);
            margin: 0 0 var(--sp-4);
            text-align: center;
            line-height: 1.5;
        }
        .lembrar {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            margin: 0 0 var(--sp-4);
            font-size: var(--fs-ui-sm);
            color: var(--text-muted);
            cursor: pointer;
        }
        .lembrar input { width: auto; margin: 0; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="login-container" id="main-content" style="width: 100%; display: flex; justify-content: center; align-items: center;">
    <div class="login-card">
        <div class="login-header">
            <img src="/static/logo.png?v=brand-gold-v1" alt="Analise Certificado" class="login-logo" width="80" height="80">
            <h1>Analise Certificado</h1>
            <p id="subtitulo">Faça login para acessar o monitor</p>
        </div>

        <!-- ── Entrar ────────────────────────────────────────────────── -->
        <section id="view-login">
            <div id="login-error" role="alert" aria-live="assertive">E-mail ou senha incorretos.</div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required autocomplete="username" placeholder="exemplo@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                        <button type="button" class="btn-olho" id="btn-olho"
                                aria-controls="password" aria-pressed="false"
                                aria-label="Mostrar senha">👁</button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="btn-entrar">Acessar o painel</button>
            </form>

            <button type="button" class="link-discreto" id="btn-esqueci">Esqueci minha senha</button>
        </section>

        <!-- ── Segundo passo do login (10/10/2026) ───────────────────── -->
        <section id="view-codigo-login" hidden>
            <div id="lc-msg" role="alert" aria-live="assertive"></div>
            <form id="form-lc">
                <p class="passo-dica" id="lc-dica"></p>
                <div class="form-group">
                    <label for="lc-codigo" id="lc-rotulo">Código de 6 dígitos</label>
                    <input type="text" id="lc-codigo" required
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           autocomplete="one-time-code" placeholder="000000">
                </div>
                <label class="lembrar"><input type="checkbox" id="lc-lembrar"> Lembrar deste navegador por 7 dias</label>
                <button type="submit" class="login-btn" id="btn-lc">Entrar</button>
            </form>
            <button type="button" class="link-discreto" id="btn-lc-metodo" hidden></button>
            <button type="button" class="link-discreto" id="btn-lc-voltar">Voltar e pedir outro código</button>
        </section>

        <!-- ── Recuperar ─────────────────────────────────────────────── -->
        <section id="view-recuperar" hidden>
            <div id="rec-msg" role="alert" aria-live="polite"></div>

            <!-- Passo 1: pedir o código -->
            <form id="form-pedir">
                <p class="passo-dica">Informe seu e-mail e enviaremos um código de 6 dígitos.</p>
                <div class="form-group">
                    <label for="rec-email">E-mail</label>
                    <input type="email" id="rec-email" required autocomplete="username" placeholder="exemplo@email.com">
                </div>
                <button type="submit" class="login-btn" id="btn-pedir">Enviar código</button>
            </form>

            <!-- Passo 2: conferir o código -->
            <form id="form-codigo" hidden>
                <p class="passo-dica">
                    Digite o código que enviamos.<br>
                    Ele vale por 15 minutos e permite 3 tentativas.
                </p>
                <div class="form-group">
                    <label for="campo-codigo">Código de 6 dígitos</label>
                    <input type="text" id="campo-codigo" required
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           autocomplete="one-time-code" placeholder="000000">
                </div>
                <button type="submit" class="login-btn" id="btn-conferir">Continuar</button>
            </form>

            <!-- Passo 3: nova senha -->
            <form id="form-senha" hidden>
                <p class="passo-dica">Escolha a senha nova.</p>
                <div class="form-group">
                    <label for="nova-senha">Nova senha</label>
                    <div class="campo-senha">
                        <input type="password" id="nova-senha" required minlength="12"
                               autocomplete="new-password" placeholder="mínimo 12 caracteres">
                        <button type="button" class="btn-olho" id="btn-olho-nova"
                                aria-controls="nova-senha" aria-pressed="false"
                                aria-label="Mostrar senha">👁</button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="btn-salvar">Salvar e entrar</button>
            </form>

            <button type="button" class="link-discreto" id="btn-voltar">Voltar para o login</button>
        </section>
    </div>
    </main>

    <script nonce="{{ request.state.nonce }}">
        // Onde o JWT morava até a Leva D (09/10/2026); só para apagar o de antes.
        const KEY_STORAGE = "cert_robot_api_key";

        // Para onde ir depois de entrar: a página de origem (`?next=`), quando
        // for um caminho deste portal; senão o Início. Nada de URL absoluta.
        // Resolvido pelo próprio parser de URL e comparado pela origem: a regex
        // de antes recusava `//host` mas aceitava `/\host`, que o navegador lê
        // como `//host` e levava para outro site (auditoria de 10/10/2026).
        function destinoAposLogin() {
            const next = new URLSearchParams(location.search).get("next") || "";
            try {
                const u = new URL(next, location.origin);
                // O que se confere tem de ser o que se navega (auditoria run-2,
                // 12/10/2026): "/.//host" resolve na origem do portal, mas o
                // caminho normalizado é "//host" — e "//host" no location.href
                // vai para outro site. Uma barra só, seguida de algo que não seja
                // barra nem barra invertida.
                const destino = u.pathname + u.search + u.hash;
                if (next.startsWith("/") && u.origin === location.origin && !u.pathname.startsWith("/login")
                    && /^\/(?![\/\\])/.test(destino)) {
                    return destino;
                }
            } catch (_e) { /* inválido: vai para o Início */ }
            return "/";
        }

        // Já há sessão (o cookie anti-CSRF é legível; o de sessão, não)? Então
        // a pessoa chegou aqui por um link de outro site — um e-mail, por
        // exemplo —, e o SameSite=Strict não deixou o cookie ir junto. Daqui a
        // navegação é do próprio portal e o cookie vai. Uma vez só por minuto:
        // se a sessão não valer, o servidor apaga os cookies e a tela fica.
        (function seguirSeJaTemSessao() {
            try {
                if (!document.cookie.split("; ").some((c) => c.startsWith("cg_csrf="))) return;
                const ultima = Number(sessionStorage.getItem("cg_login_seguiu") || 0);
                if (Date.now() - ultima < 60000) return;
                sessionStorage.setItem("cg_login_seguiu", String(Date.now()));
                location.replace(destinoAposLogin());
            } catch (_e) { /* sem storage: fica na tela de login */ }
        })();

        // Mensagem de um erro HTTP: `detail` pode ser texto (nossos erros) ou a
        // lista do validador do servidor — que virava "[object Object]".
        function textoDoErro(corpo, padrao) {
            const d = corpo && corpo.detail;
            if (typeof d === "string" && d) return d;
            if (Array.isArray(d) && d.length) return d.map((x) => x.msg || JSON.stringify(x)).join(" ");
            return padrao;
        }

        // Aviso deixado pela página anterior (ex.: "Sessão encerrada. Entre
        // novamente."). O login não carrega o script compartilhado das outras
        // páginas, então lê o mesmo sessionStorage aqui.
        (function avisoPendente() {
            try {
                const raw = sessionStorage.getItem("cg_toast_pendente");
                if (!raw) return;
                sessionStorage.removeItem("cg_toast_pendente");
                const { message } = JSON.parse(raw);
                const el = document.getElementById("login-error");
                if (message && el) { el.textContent = message; el.style.display = "block"; }
            } catch (_e) { /* sem storage */ }
        })();

        const $ = (id) => document.getElementById(id);

        /**
         * Alterna mostrar/ocultar de um campo de senha.
         *
         * `aria-pressed` e `aria-label` acompanham o estado: sem isso, o leitor
         * de tela anuncia sempre "Mostrar senha", inclusive quando a senha já
         * está visível — e a pessoa não tem como saber em que estado está.
         */
        function ligarOlho(btnId, campoId) {
            const btn = $(btnId), campo = $(campoId);
            btn.addEventListener('click', () => {
                const revelado = campo.type === 'text';
                campo.type = revelado ? 'password' : 'text';
                btn.setAttribute('aria-pressed', String(!revelado));
                btn.setAttribute('aria-label', revelado ? 'Mostrar senha' : 'Ocultar senha');
                btn.textContent = revelado ? '👁' : '🙈';
                campo.focus();
            });
        }
        ligarOlho('btn-olho', 'password');
        ligarOlho('btn-olho-nova', 'nova-senha');

        // ── Entrar ─────────────────────────────────────────────────────
        $('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Normalizado aqui também: o servidor compara em minúsculas desde
            // 17/08, e guardar "Ana@X.com" no localStorage faria a tela e a
            // sessão discordarem sobre quem está logado.
            const email = $('email').value.trim().toLowerCase();
            const password = $('password').value;
            const btn = $('btn-entrar');
            const errorDiv = $('login-error');

            btn.disabled = true;
            btn.textContent = 'Autenticando...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    aposSenha(email, await response.json());
                } else {
                    const error = await response.json().catch(() => ({}));
                    errorDiv.textContent = textoDoErro(error, 'Falha ao autenticar.');
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão com o servidor.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Acessar o painel';
            }
        });

        // A sessão veio no cookie HttpOnly (Leva D); o token do corpo não é
        // guardado. Apaga o de antes, se houver.
        function entrou(email, role) {
            localStorage.removeItem(KEY_STORAGE);
            localStorage.setItem('user_role', role);
            localStorage.setItem('user_email', email);
            window.location.href = destinoAposLogin();
        }

        // ── Segundo passo (10/10/2026) ─────────────────────────────────
        // Sem o navegador lembrado, a senha só devolve um desafio: a sessão
        // sai com o código do e-mail ou do app autenticador.
        const lc = { email: '', desafio: '', metodo: 'email', temApp: false, enviado: null };

        function aposSenha(email, dados) {
            if (dados.etapa !== 'codigo') { entrou(email, dados.role); return; }
            lc.email = email;
            lc.desafio = dados.desafio;
            lc.temApp = !!dados.app_autenticador;
            lc.enviado = dados.email;
            lc.metodo = lc.enviado ? 'email' : 'app';
            $('view-login').hidden = true;
            $('view-recuperar').hidden = true;
            $('view-codigo-login').hidden = false;
            $('subtitulo').textContent = 'Confirme que é você';
            $('lc-msg').style.display = 'none';
            mostrarMetodo();
        }

        function mostrarMetodo() {
            const porEmail = lc.metodo === 'email';
            $('lc-dica').textContent = porEmail
                ? `Enviamos um código para ${lc.enviado}. Ele vale por 15 minutos e permite 3 tentativas.`
                : 'Abra o app autenticador no celular e digite o código que aparece para o portal de certificados.';
            $('lc-rotulo').textContent = porEmail ? 'Código do e-mail' : 'Código do app';
            const alt = $('btn-lc-metodo');
            alt.hidden = !(lc.temApp && lc.enviado);
            alt.textContent = porEmail ? 'Usar o código do app autenticador' : 'Usar o código do e-mail';
            $('lc-codigo').value = '';
            $('lc-codigo').focus();
        }

        $('btn-lc-metodo').addEventListener('click', () => {
            lc.metodo = lc.metodo === 'email' ? 'app' : 'email';
            $('lc-msg').style.display = 'none';
            mostrarMetodo();
        });

        $('btn-lc-voltar').addEventListener('click', () => {
            $('view-codigo-login').hidden = true;
            $('view-login').hidden = false;
            $('subtitulo').textContent = 'Faça login para acessar o monitor';
            lc.desafio = '';
            $('password').value = '';
            $('password').focus();
        });

        $('form-lc').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('btn-lc');
            const msg = $('lc-msg');
            btn.disabled = true;
            btn.textContent = 'Conferindo...';
            msg.style.display = 'none';
            try {
                const r = await fetch('/api/login/codigo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        desafio: lc.desafio,
                        codigo: $('lc-codigo').value.trim(),
                        metodo: lc.metodo,
                        lembrar: $('lc-lembrar').checked
                    })
                });
                const dados = await r.json().catch(() => ({}));
                if (r.ok) { entrou(lc.email, dados.role); return; }
                msg.textContent = textoDoErro(dados, 'Código inválido ou expirado.');
                msg.className = 'msg-erro';
                msg.style.display = 'block';
                $('lc-codigo').select();
            } catch (err) {
                msg.textContent = 'Erro de conexão com o servidor.';
                msg.className = 'msg-erro';
                msg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });

        // ── Recuperar ──────────────────────────────────────────────────
        function mostrarMsg(texto, ok) {
            const el = $('rec-msg');
            el.textContent = texto;
            el.className = ok ? 'msg-ok' : 'msg-erro';
            el.style.display = 'block';
        }

        function trocarView(paraRecuperar) {
            $('view-login').hidden = paraRecuperar;
            $('view-recuperar').hidden = !paraRecuperar;
            $('subtitulo').textContent = paraRecuperar
                ? 'Recuperação de senha'
                : 'Faça login para acessar o monitor';
            if (paraRecuperar) {
                $('rec-email').value = $('email').value.trim().toLowerCase();
                $('rec-email').focus();
            }
        }

        $('btn-esqueci').addEventListener('click', () => trocarView(true));
        $('btn-voltar').addEventListener('click', () => {
            trocarView(false);
            // Volta ao passo 1: reabrir a recuperação depois de sair no meio
            // não pode reaproveitar um código que já pode ter expirado.
            $('form-pedir').hidden = false;
            $('form-codigo').hidden = true;
            $('form-senha').hidden = true;
            $('rec-msg').style.display = 'none';
            $('campo-codigo').value = '';
            $('nova-senha').value = '';
        });

        async function postar(url, corpo) {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(corpo)
            });
            let dados = {};
            try { dados = await r.json(); } catch (e) { /* corpo vazio */ }
            return { ok: r.ok, dados };
        }

        // Passo 1 — pedir o código
        $('form-pedir').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('btn-pedir');
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            try {
                const { ok, dados } = await postar('/api/senha/codigo', {
                    email: $('rec-email').value.trim().toLowerCase()
                });
                if (ok) {
                    // A resposta é a MESMA exista ou não a conta — de propósito,
                    // para a tela não virar detector de quem tem cadastro. Por
                    // isso avançamos para o passo do código de qualquer jeito.
                    mostrarMsg(dados.message || 'Código enviado.', true);
                    $('form-pedir').hidden = true;
                    $('form-codigo').hidden = false;
                    $('campo-codigo').focus();
                } else {
                    mostrarMsg(dados.detail || 'Não foi possível enviar agora.', false);
                }
            } catch (err) {
                mostrarMsg('Erro de conexão com o servidor.', false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar código';
            }
        });

        // Passo 2 — conferir o código
        $('form-codigo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('btn-conferir');
            btn.disabled = true;
            btn.textContent = 'Conferindo...';
            try {
                const { ok, dados } = await postar('/api/senha/verificar', {
                    email: $('rec-email').value.trim().toLowerCase(),
                    codigo: $('campo-codigo').value.trim()
                });
                if (ok) {
                    $('rec-msg').style.display = 'none';
                    $('form-codigo').hidden = true;
                    $('form-senha').hidden = false;
                    $('nova-senha').focus();
                } else {
                    mostrarMsg(dados.detail || 'Código inválido.', false);
                }
            } catch (err) {
                mostrarMsg('Erro de conexão com o servidor.', false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Continuar';
            }
        });

        // Passo 3 — salvar a senha nova e entrar
        $('form-senha').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('btn-salvar');
            const email = $('rec-email').value.trim().toLowerCase();
            const senha = $('nova-senha').value;
            btn.disabled = true;
            btn.textContent = 'Salvando...';
            try {
                const { ok, dados } = await postar('/api/senha/redefinir', {
                    email, codigo: $('campo-codigo').value.trim(), password: senha
                });
                if (!ok) {
                    mostrarMsg(dados.detail || 'Não foi possível redefinir.', false);
                    return;
                }
                // Entra direto com a senha recém-criada: pedir para digitá-la
                // de novo agora seria cerimônia — ela acabou de ser escolhida
                // nesta tela, e o código já provou quem é a pessoa.
                const login = await postar('/api/login', { email, password: senha });
                if (login.ok) {
                    // Sem o navegador lembrado, o login ainda pede o código
                    // de entrada: é o mesmo segundo passo de sempre.
                    aposSenha(email, login.dados);
                } else {
                    // A mensagem vai para a caixa da tela de login, que é a que
                    // fica visível depois de `trocarView(false)`.
                    trocarView(false);
                    const el = document.getElementById("login-error");
                    if (el) { el.textContent = 'Senha alterada. Entre com a nova senha.'; el.style.display = 'block'; }
                }
            } catch (err) {
                mostrarMsg('Erro de conexão com o servidor.', false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Salvar e entrar';
            }
        });
    </script>
</body>
</html>
