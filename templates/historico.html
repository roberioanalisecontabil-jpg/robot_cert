<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Histórico — Analise Certificado</title>
  <link rel="icon" href="/favicon.ico?v=brand-gold-v1" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Peso 800 removido: era baixado e nunca usado (nenhum font-weight:800 no projeto). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=tabela-cheia-2026-08b" />
</head>
<body>
  <a href="#main-content" class="skip-to-content">Pular para o conteúdo principal</a>
  {% include "_sidebar.html" %}

  <main class="main-content" id="main-content">
    <header class="page-header">
      <h1>Histórico de Certificados</h1>
      <p>Certificados já mapeados em algum momento e a última data verificada.</p>
    </header>

    <div class="table-container table-container--cheia" id="table-container-hist">
      <div class="toolbar">
        <div class="toolbar__status" aria-live="polite">
          <p id="status-msg" class="status-line"></p>
          <p class="hint" id="count-hint"></p>
        </div>
        <div class="toolbar__actions">
          <label for="busca-historico" class="cg-sr-only">Buscar no histórico por nome, arquivo ou documento</label>
          <input class="form-control campo-busca" type="search" id="busca-historico" placeholder="Buscar por nome, arquivo ou documento" />
          <button type="button" id="btn-refresh" class="primary">Atualizar</button>
          <button type="button" id="btn-export-pdf">Exportar PDF</button>
          <button type="button" id="btn-export-excel">Exportar Excel</button>
        </div>
      </div>
      <div class="table-scroll-anchor">
        <div class="table-scroll" tabindex="0" role="region" aria-label="Histórico de certificados">
          <table role="table">
            <thead role="rowgroup">
              <tr role="row">
                <th role="columnheader">Nome</th>
                <th role="columnheader">CNPJ/CPF</th>
                <th role="columnheader">Última data verificada</th>
                <th role="columnheader">Vencimento do certificado</th>
              </tr>
            </thead>
            <tbody role="rowgroup" id="tbody-historico"></tbody>
          </table>
        </div>
      </div>
      <nav
        id="paginacao-toolbar-hist"
        class="cg-page-nav"
        aria-label="Navegação por páginas"
      >
        <div id="pag-meta-hist" class="cg-page-nav__meta"></div>
        <div class="cg-page-nav__row">
          <ul id="pag-ul-hist" class="cg-page-nav__ul" role="list">
            <li>
              <button type="button" id="btn-hist-prev" class="cg-page-link cg-page-link--rounded-s" title="Página anterior">
                Anterior
              </button>
            </li>
            <li id="pag-li-next-hist">
              <button type="button" id="btn-hist-next" class="cg-page-link cg-page-link--rounded-e" title="Próxima página">
                Seguinte
              </button>
            </li>
          </ul>
          <div>
            <label for="pag-perpage-hist" class="cg-sr-only">Registros por página</label>
            <select id="pag-perpage-hist" class="cg-page-perpage-select" title="Itens por página">
              <option value="10">10 por página</option>
              <option value="25">25 por página</option>
              <option value="50">50 por página</option>
              <option value="100">100 por página</option>
            </select>
          </div>
        </div>
      </nav>
    </div>
  </main>

  <script nonce="{{ request.state.nonce }}" src="/static/ui-common.js?v=menu-sem-piscar-2026-08"></script>
  <script nonce="{{ request.state.nonce }}">
    const LS_PER_PAGE_HIST = "cg_per_page_historico";
    const ALLOWED_PER_PAGE_HIST = [10, 25, 50, 100];

    function porPaginaHist() {
      const sel = document.getElementById("pag-perpage-hist");
      const n = sel ? parseInt(sel.value, 10) : 10;
      return ALLOWED_PER_PAGE_HIST.includes(n) ? n : 10;
    }

    function initPerPageHist() {
      const sel = document.getElementById("pag-perpage-hist");
      if (!sel) return;
      let stored = parseInt(localStorage.getItem(LS_PER_PAGE_HIST) || "10", 10);
      if (!ALLOWED_PER_PAGE_HIST.includes(stored)) stored = 10;
      sel.value = String(stored);
      localStorage.setItem(LS_PER_PAGE_HIST, String(stored));
      sel.addEventListener("change", () => {
        localStorage.setItem(LS_PER_PAGE_HIST, sel.value);
        paginaAtualHist = 1;
        carregarHistorico();
      });
    }

    let paginaAtualHist = 1;
    let debounceHist = null;
    let itensVisiveis = [];

    function toggleLoading(show, text) {
      if (typeof setTableLoading === "function") {
        setTableLoading("table-container-hist", show, text);
      }
    }

    // `esc` vem de ui-common.js desde 16/08 — era duplicada em seis telas.

    function fmtData(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("pt-BR");
    }

    function fmtDataUtc(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString("pt-BR", { timeZone: "UTC" });
    }

    function atualizarPaginacaoHist(pg) {
      cgPageNavRefresh({
        bar: "paginacao-toolbar-hist",
        meta: "pag-meta-hist",
        ul: "pag-ul-hist",
        liNext: "pag-li-next-hist",
        prev: "btn-hist-prev",
        next: "btn-hist-next",
        pg: pg,
        metaFormatter: (p) =>
          "Página " + p.pagina + " de " + p.total_paginas + " · " + p.total_itens + " registro(s)",
        hideWhenSingle: true,
        goToPage: (pn) => {
          paginaAtualHist = pn;
          carregarHistorico();
        },
        maxButtons: 5,
      });
    }

    function renderLinhasHistorico(rows) {
      const tb = document.getElementById("tbody-historico");
      limparSkeleton(tb);

      if (!rows.length) {
        const busca = (document.getElementById("busca-historico")?.value || "").trim();
        if (busca) {
          renderEmptyRow(tb, 4, {
            icon: "🔍",
            title: "Nenhum registro para “" + busca + "”",
            description: "Tente outro nome, CNPJ ou CPF.",
            actionText: "Limpar busca",
            onAction: () => {
              document.getElementById("busca-historico").value = "";
              paginaAtualHist = 1;
              carregarHistorico();
            },
          });
        } else {
          renderEmptyRow(tb, 4, {
            icon: "🕓",
            title: "Ainda não há histórico",
            description:
              "O histórico é montado a partir dos snapshots enviados pelo agente. Assim que houver leituras, elas aparecem aqui.",
          });
        }
        itensVisiveis = [];
        return;
      }

      tb.innerHTML = rows
        .map(
          (it) => `
        <tr role="row">
          <td role="cell" data-label="Nome">${esc(it.nome)}</td>
          <td role="cell" data-label="CNPJ/CPF">${esc(it.documento || "—")}</td>
          <td role="cell" data-label="Última verificação">${esc(fmtDataUtc(it.ultima_data_registrada))}</td>
          <td role="cell" data-label="Vencimento">${esc(fmtDataUtc(it.vencimento_certificado))}</td>
        </tr>
      `
        )
        .join("");
      itensVisiveis = rows;
    }

    async function fetchHistoricoExportacao() {
      toggleLoading(true, "Exportação...");
      try {
        const params = new URLSearchParams({
          busca: document.getElementById("busca-historico").value || "",
          todas_filtradas: "true",
        });
        const r = await fetch("/api/certificados/historico?" + params.toString(), { headers: getHeaders() });
        if (r.status === 401) {
          logout();
          return null;
        }
        if (!r.ok) {
          showToast("Não foi possível exportar (erro " + r.status + "): " + (await mensagemCorpoErro(r)), "error");
          return null;
        }
        return await r.json();
      } finally {
        toggleLoading(false);
      }
    }

    async function exportarExcelVisivel() {
      const d = await fetchHistoricoExportacao();
      if (!d || !d.itens) return;
      if (d.lista_truncada) {
        showToast(
          "O arquivo contém apenas os primeiros " +
            d.itens.length.toLocaleString("pt-BR") +
            " registros — o filtro atual excede o limite de exportação.",
          "warning"
        );
      }
      const headers = ["Nome", "CNPJ/CPF", "Última data verificada", "Vencimento do certificado"];
      const rows = d.itens.map((it) => [
        it.nome || "",
        it.documento || "",
        fmtDataUtc(it.ultima_data_registrada),
        fmtDataUtc(it.vencimento_certificado),
      ]);
      const all = [headers, ...rows];
      const csv = all
        .map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";"))
        .join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "historico_certificados_filtrado.csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function exportarPdfVisivel() {
      const d = await fetchHistoricoExportacao();
      if (!d || !d.itens) return;
      if (d.lista_truncada) {
        showToast(
          "O PDF contém apenas os primeiros " +
            d.itens.length.toLocaleString("pt-BR") +
            " registros — o filtro atual excede o limite de exportação.",
          "warning"
        );
      }
      const linhas = d.itens
        .map((it) => `
          <tr>
            <td>${esc(it.nome || "")}</td>
            <td>${esc(it.documento || "")}</td>
            <td>${esc(fmtDataUtc(it.ultima_data_registrada))}</td>
            <td>${esc(fmtDataUtc(it.vencimento_certificado))}</td>
          </tr>
        `)
        .join("");
      const w = window.open("", "_blank");
      if (!w) return;
      w.document.write(`
        <html>
          <head>
            <meta charset="utf-8" />
            <title>Histórico de certificados filtrado</title>
            <style>
              body { font-family: Segoe UI, Arial, sans-serif; padding: 20px; }
              h1 { margin: 0 0 8px; font-size: 20px; }
              p { margin: 0 0 14px; color: #555; }
              table { width: 100%; border-collapse: collapse; font-size: var(--fs-label); }
              th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
              th { background: #f3f4f6; }
            </style>
          </head>
          <body>
            <h1>Histórico de certificados</h1>
            <p>Gerado em ${new Date().toLocaleString("pt-BR")} | Total exportado: ${d.itens.length}</p>
            <table>
              <thead>
                <tr>
                  <th>Nome</th><th>CNPJ/CPF</th><th>Última data verificada</th><th>Vencimento do certificado</th>
                </tr>
              </thead>
              <tbody>${linhas}</tbody>
            </table>
          </body>
        </html>
      `);
      w.document.close();
      w.focus();
      w.print();
    }

    let primeiroCarregamentoHist = true;

    async function carregarHistorico() {
      const st = document.getElementById("status-msg");
      st.textContent = "Carregando…";
      if (primeiroCarregamentoHist) {
        renderSkeletonRows("tbody-historico", Math.min(porPaginaHist(), 10), 4);
      } else {
        toggleLoading(true, "Carregando histórico...");
      }
      try {
        const params = new URLSearchParams({
          pagina: String(paginaAtualHist),
          por_pagina: String(porPaginaHist()),
          busca: document.getElementById("busca-historico").value || "",
        });
        const r = await fetch("/api/certificados/historico?" + params.toString(), { headers: getHeaders() });
        if (r.status === 401) {
          logout();
          return;
        }
        if (!r.ok) {
          const detalhe = await mensagemCorpoErro(r);
          st.textContent = `Erro ${r.status}`;
          showToast("Não foi possível carregar o histórico: " + detalhe, "error");
          renderEmptyRow("tbody-historico", 4, {
            icon: "⚠️",
            title: "Erro ao carregar o histórico",
            description: detalhe || `O servidor respondeu com erro ${r.status}.`,
            actionText: "Tentar novamente",
            onAction: () => carregarHistorico(),
          });
          return;
        }
        const j = await r.json();
        if (j.paginacao) {
          paginaAtualHist = j.paginacao.pagina;
          atualizarPaginacaoHist(j.paginacao);
        } else {
          atualizarPaginacaoHist(null);
        }
        setBannerAviso("table-container-hist", mensagemLimiteExportacao(j.paginacao));
        st.textContent = j.atualizado_em ? "Atualizado em: " + new Date(j.atualizado_em).toLocaleString("pt-BR") : "";
        const rows = j.itens || [];
        renderLinhasHistorico(rows);
        document.getElementById("count-hint").textContent =
          typeof j.total === "number"
            ? j.total + " registro(s)"
            : rows.length + " registro(s) nesta página";
      } catch (e) {
        st.textContent = "Falha de conexão.";
        showToast("Falha de conexão com o servidor: " + e, "error");
        renderEmptyRow("tbody-historico", 4, {
          icon: "🔌",
          title: "Sem conexão com o servidor",
          description: "Verifique se o portal está em execução e tente novamente.",
          actionText: "Tentar novamente",
          onAction: () => carregarHistorico(),
        });
      } finally {
        toggleLoading(false);
        limparSkeleton("tbody-historico");
        primeiroCarregamentoHist = false;
      }
    }

    document.getElementById("btn-refresh").addEventListener("click", () => {
      paginaAtualHist = 1;
      carregarHistorico();
    });
    document.getElementById("busca-historico").addEventListener("input", () => {
      paginaAtualHist = 1;
      clearTimeout(debounceHist);
      debounceHist = setTimeout(carregarHistorico, 320);
    });
    document.getElementById("btn-export-excel").addEventListener("click", () => void exportarExcelVisivel());
    document.getElementById("btn-export-pdf").addEventListener("click", () => void exportarPdfVisivel());
    document.getElementById("btn-hist-prev").addEventListener("click", () => {
      if (paginaAtualHist > 1) {
        paginaAtualHist--;
        carregarHistorico();
      }
    });
    document.getElementById("btn-hist-next").addEventListener("click", () => {
      paginaAtualHist++;
      carregarHistorico();
    });

    (async function init() {
      // A revelação da sidebar por papel mora em ui-common.js
      // (initSidebarPorPapel) — era copiada por tela e as cópias divergiram.
      initPerPageHist();
      await carregarHistorico();
    })();
  </script>
</body>
</html>
